name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: msbuild "Plain Craft Launcher 2.sln" /restore /t:Build /p:Configuration=Release /m /nologo /v:m

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TYW-Minecraft-Launcher
          path: 'Plain Craft Launcher 2/bin/Release/TYW Minecraft Launcher.exe'
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 'Plain Craft Launcher 2/bin/Release/TYW Minecraft Launcher.exe'
          generate_release_notes: true
